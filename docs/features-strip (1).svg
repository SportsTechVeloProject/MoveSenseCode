<svg viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- card 1: Dual IMU Sync -->
  <g transform="translate(10,10)">
    <rect width="280" height="140" rx="14" fill="#111B2E" stroke="#26314A"/>
    <circle cx="40" cy="45" r="18" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="32" cy="45" r="5.5" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="48" cy="45" r="5.5" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <line x1="38" y1="45" x2="42" y2="45" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-dasharray="1,3.2"/>
    <text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Dual IMU Sync</text>
    <text x="24" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Two Movesense sensors,</text>
    <text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">one bar, connected live</text>
  </g>

  <!-- card 2: Live Data View -->
  <g transform="translate(310,10)">
    <rect width="280" height="140" rx="14" fill="#111B2E" stroke="#26314A"/>
    <circle cx="40" cy="45" r="18" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M28,45 L34,45 L38,36 L42,54 L46,45 L52,45" stroke="#2DD4BF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Live Data View</text>
    <text x="24" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Watch raw accelerometer</text>
    <text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">samples as they arrive</text>
  </g>

  <!-- card 3: CSV Export -->
  <g transform="translate(610,10)">
    <rect width="280" height="140" rx="14" fill="#111B2E" stroke="#26314A"/>
    <circle cx="40" cy="45" r="18" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-width="2"/>
    <path d="M40,32 L40,52" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <path d="M33,45 L40,52 L47,45" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29,60 L51,60" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">CSV Export</text>
    <text x="24" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Record a session, export</text>
    <text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">it, analyze it anywhere</text>
  </g>

  <!-- card 4: No Backend Needed -->
  <g transform="translate(910,10)">
    <rect width="280" height="140" rx="14" fill="#111B2E" stroke="#26314A"/>
    <circle cx="40" cy="45" r="18" fill="#60A5FA" fill-opacity="0.12" stroke="#60A5FA" stroke-width="2"/>
    <rect x="27" y="33" width="26" height="20" rx="3" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <line x1="27" y1="40" x2="53" y2="40" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="31.5" cy="36.5" r="1.2" fill="#60A5FA"/>
    <circle cx="35.5" cy="36.5" r="1.2" fill="#60A5FA"/>
    <text x="24" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">No Backend Needed</text>
    <text x="24" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Runs entirely in the</text>
    <text x="24" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">browser, nothing to host</text>
  </g>
</svg>
