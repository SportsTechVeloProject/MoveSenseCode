<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tube" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="18%" stop-color="#CBD5E1"/>
      <stop offset="45%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1F2937" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
  </g>

  <!-- barbell -->
  <g transform="translate(160,140)">
    <!-- left plates: smallest outermost, largest innermost (nearest the bar) -->
    <rect x="-50" y="-40" width="16" height="80" rx="3" fill="#3B4A6B"/>
    <rect x="-32" y="-56" width="20" height="112" rx="3" fill="#3B4A6B"/>
    <!-- right plates: largest innermost (nearest the bar), smallest outermost -->
    <rect x="890" y="-56" width="20" height="112" rx="3" fill="#3B4A6B"/>
    <rect x="912" y="-40" width="16" height="80" rx="3" fill="#3B4A6B"/>

    <!-- bar: shaded 3D tube -->
    <rect x="-10" y="-7" width="900" height="14" rx="7" fill="url(#tube)"/>
    <rect x="-10" y="-6" width="900" height="2" rx="1" fill="#F1F5F9" opacity="0.35"/>

    <!-- sine wave, drawn as one continuous curve on top of the bar -->
    <path d="M 20 0 C 37.5 -30 72.5 -30 90 0
             C 107.5 30 142.5 30 160 0
             C 177.5 -30 212.5 -30 230 0
             C 247.5 30 282.5 30 300 0
             C 317.5 -30 352.5 -30 370 0
             C 387.5 30 422.5 30 440 0
             C 457.5 -30 492.5 -30 510 0
             C 527.5 30 562.5 30 580 0
             C 597.5 -30 632.5 -30 650 0
             C 667.5 30 702.5 30 720 0
             C 737.5 -30 772.5 -30 790 0
             C 807.5 30 842.5 30 860 0"
          fill="none" stroke="url(#accentLine)" stroke-width="3" stroke-linecap="round"/>

    <!-- left sensor, mounted on the outer tip of the barbell -->
    <circle cx="-56" cy="0" r="18" fill="url(#pulse)"/>
    <circle cx="-56" cy="0" r="10" fill="#155E75" stroke="#22D3EE" stroke-width="1.5" filter="url(#glow)"/>

    <!-- right sensor, mounted on the outer tip of the barbell -->
    <circle cx="936" cy="0" r="18" fill="url(#pulseGreen)"/>
    <circle cx="936" cy="0" r="10" fill="#166534" stroke="#34D399" stroke-width="1.5" filter="url(#glow)"/>
  </g>

  <!-- title block -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="50" y="60" font-size="50" font-weight="700" fill="#F8FAFC">MoveSense Barbell Velocity Tracker</text>
    <text x="50" y="245" font-size="20" fill="#94A3B8">Understand your training — real-time barbell velocity from dual Movesense IMUs</text>
  </g>

  <!-- status chip -->
  <g transform="translate(960,36)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#0D1526" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="18" cy="14" r="4" fill="#34D399"/>
    <text x="32" y="19" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.5" fill="#F8FAFC">PROOF OF CONCEPT</text>
  </g>
</svg>
