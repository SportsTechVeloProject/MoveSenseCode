<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="mAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="mChartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barDeadlift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="20" fill="url(#mBg)"/>

  <!-- top bar -->
  <circle cx="60" cy="65" r="20" fill="#0D1526" stroke="#22D3EE" stroke-width="2"/>
  <line x1="50" y1="65" x2="70" y2="65" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="65" r="3" fill="#22D3EE"/>
  <circle cx="70" cy="65" r="3" fill="#34D399"/>
  <text x="95" y="61" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">MoveSense</text>
  <text x="95" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Barbell Velocity Tracker</text>

  <rect x="1000" y="48" width="160" height="30" rx="15" fill="#0D1526" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="1018" cy="63" r="5" fill="#34D399"/>
  <text x="1032" y="67" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#F8FAFC">Live &#183; Connected</text>

  <!-- workout picker -->
  <rect x="40" y="112" width="130" height="38" rx="19" fill="url(#mAccent)"/>
  <text x="105" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1120">Deadlift</text>

  <rect x="182" y="112" width="110" height="38" rx="19" fill="#111B2E" stroke="#26314A"/>
  <text x="237" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">Squat</text>

  <rect x="304" y="112" width="150" height="38" rx="19" fill="#111B2E" stroke="#26314A"/>
  <text x="379" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">Bench Press</text>

  <rect x="466" y="112" width="170" height="38" rx="19" fill="#111B2E" stroke="#26314A"/>
  <text x="551" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">Overhead Press</text>

  <!-- stat cards -->
  <g transform="translate(40,178)">
    <rect width="360" height="80" rx="12" fill="#111B2E" stroke="#26314A"/>
    <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">PEAK VELOCITY</text>
    <text x="20" y="60" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#22D3EE">1.24 m/s</text>
  </g>
  <g transform="translate(420,178)">
    <rect width="360" height="80" rx="12" fill="#111B2E" stroke="#26314A"/>
    <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">AVG VELOCITY</text>
    <text x="20" y="60" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2DD4BF">0.87 m/s</text>
  </g>
  <g transform="translate(800,178)">
    <rect width="360" height="80" rx="12" fill="#111B2E" stroke="#26314A"/>
    <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">CONSISTENCY</text>
    <text x="20" y="60" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#34D399">92%</text>
  </g>

  <!-- velocity chart panel -->
  <g transform="translate(40,278)">
    <rect width="680" height="322" rx="12" fill="#111B2E" stroke="#26314A"/>
    <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Bar Velocity &#8212; Rep by Rep</text>

    <!-- grid lines -->
    <line x1="24" y1="90" x2="656" y2="90" stroke="#1F2937" stroke-width="1"/>
    <line x1="24" y1="150" x2="656" y2="150" stroke="#1F2937" stroke-width="1"/>
    <line x1="24" y1="210" x2="656" y2="210" stroke="#1F2937" stroke-width="1"/>
    <line x1="24" y1="270" x2="656" y2="270" stroke="#1F2937" stroke-width="1"/>

    <!-- area fill under curve -->
    <path d="M24,270 C50,270 55,120 90,110 C120,102 140,270 156,270
             C180,270 185,140 220,130 C250,122 270,270 286,270
             C310,270 315,150 350,142 C380,134 400,270 416,270
             C440,270 445,165 480,158 C510,150 530,270 546,270
             C570,270 575,178 610,172 C630,168 640,270 656,270 Z"
          fill="url(#mChartFill)" stroke="none"/>

    <!-- velocity curve, one hump per rep -->
    <path d="M24,270 C50,270 55,120 90,110 C120,102 140,270 156,270
             C180,270 185,140 220,130 C250,122 270,270 286,270
             C310,270 315,150 350,142 C380,134 400,270 416,270
             C440,270 445,165 480,158 C510,150 530,270 546,270
             C570,270 575,178 610,172 C630,168 640,270 656,270"
          fill="none" stroke="url(#mAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- peak markers -->
    <circle cx="90" cy="110" r="4.5" fill="#22D3EE" stroke="#0B1120" stroke-width="1.5"/>
    <circle cx="220" cy="130" r="4.5" fill="#22D3EE" stroke="#0B1120" stroke-width="1.5"/>
    <circle cx="350" cy="142" r="4.5" fill="#22D3EE" stroke="#0B1120" stroke-width="1.5"/>
    <circle cx="480" cy="158" r="4.5" fill="#22D3EE" stroke="#0B1120" stroke-width="1.5"/>
    <circle cx="610" cy="172" r="4.5" fill="#22D3EE" stroke="#0B1120" stroke-width="1.5"/>

    <!-- rep labels -->
    <text x="90" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">Rep 1</text>
    <text x="220" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">Rep 2</text>
    <text x="350" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">Rep 3</text>
    <text x="480" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">Rep 4</text>
    <text x="610" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">Rep 5</text>
  </g>

  <!-- consistency panel -->
  <g transform="translate(740,278)">
    <rect width="420" height="322" rx="12" fill="#111B2E" stroke="#26314A"/>
    <text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Consistency Across Lifts</text>

    <!-- Deadlift -->
    <text x="24" y="76" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F8FAFC">Deadlift</text>
    <text x="396" y="76" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#22D3EE">92%</text>
    <rect x="24" y="84" width="372" height="10" rx="5" fill="#1F2937"/>
    <rect x="24" y="84" width="342" height="10" rx="5" fill="url(#barDeadlift)"/>

    <!-- Squat -->
    <text x="24" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F8FAFC">Squat</text>
    <text x="396" y="132" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF">85%</text>
    <rect x="24" y="140" width="372" height="10" rx="5" fill="#1F2937"/>
    <rect x="24" y="140" width="316" height="10" rx="5" fill="#2DD4BF"/>

    <!-- Bench Press -->
    <text x="24" y="188" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F8FAFC">Bench Press</text>
    <text x="396" y="188" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#60A5FA">78%</text>
    <rect x="24" y="196" width="372" height="10" rx="5" fill="#1F2937"/>
    <rect x="24" y="196" width="290" height="10" rx="5" fill="#60A5FA"/>

    <!-- Overhead Press -->
    <text x="24" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F8FAFC">Overhead Press</text>
    <text x="396" y="244" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399">88%</text>
    <rect x="24" y="252" width="372" height="10" rx="5" fill="#1F2937"/>
    <rect x="24" y="252" width="327" height="10" rx="5" fill="#34D399"/>

    <text x="24" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748B">Consistency = rep-to-rep velocity variance</text>
  </g>
</svg>
